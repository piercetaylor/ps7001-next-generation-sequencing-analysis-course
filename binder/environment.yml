# Binder environment: enough to run the lightweight R notebooks
# (M4L1, M4P1, M4P2, M4E1, M6P2) and to read the Bash notebooks.
# HPC tools (STAR, Salmon, MACS2, HOMER, ...) are intentionally not included;
# see environment/ for the full course environments.
name: ngs-course-binder
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - jupyterlab
  - bash_kernel
  - r-base=4.3
  - r-irkernel
  - r-tidyverse
  - r-ggplot2
  - r-ggrepel
  - r-pheatmap
  - r-reshape2
  - r-rcolorbrewer
  - bioconductor-deseq2
  - bioconductor-apeglm
  - bioconductor-tximport
  - bioconductor-annotationdbi
  - bioconductor-org.at.tair.db
  - bioconductor-clusterprofiler
  - bioconductor-enrichplot
  - bioconductor-go.db
  - bioconductor-biomart
  - bioconductor-pathview
  - bioconductor-dose
  - bioconductor-annotationhub
  - bioconductor-ensembldb
  - curl
