name: deploy-book

# Build the Jupyter Book and deploy it to GitHub Pages.
# Notebooks are NOT executed (execute_notebooks: off); they need the HPC.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check relative links, images and _toc.yml
        run: python tools/check_links.py

      - name: Install Jupyter Book
        run: pip install "jupyter-book>=1.0,<2"

      - name: Build the book
        run: jupyter-book build . --warningiserror --keep-going

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
